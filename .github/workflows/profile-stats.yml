
name: Generate Profile Statistics and Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  developer-metrics:
    name: Generate Developer Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BigSmoke4
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Dhaka
          config_display: large
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C

  contribution-snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: BigSmoke4
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239D72D9&color_dots=%230D0B12,%233B2852,%236D4A91,%239D72D9,%23E6B7FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E6B7FF

      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
